---
version: v1
type: profile
name: python-baseline
display_name: Python Baseline
context:
  provider: github
alert: "on"
remediate: "off"
repository:
  # Ensure the project uses a lock file or pinned dependencies
  - type: python_lock_file_exists
    name: python_lock_file_exists
    def: {}

  # Ensure a pyproject.toml is present
  - type: python_pyproject_toml_exists
    name: python_pyproject_toml_exists
    def: {}

  # Ensure a type checker is configured (tool-agnostic)
  - type: python_type_checker_configured
    name: python_type_checker_configured
    def: {}

  # Ensure a linter is configured (tool-agnostic)
  - type: python_linter_configured
    name: python_linter_configured
    def: {}
