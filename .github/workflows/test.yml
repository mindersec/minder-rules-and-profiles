---
name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Run tests
        uses: mindersec/minder-action/test@v1.1.1
        id: run-tests
        with:
          release: v0.3.1
          rules-directory: rule-types

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure() # always run even if tests fail
        with:
          report_paths: ${{ steps.run-tests.outputs.junit-filename }}
