---
name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run tests
        uses: mindersec/minder-action/test@36984c41ce733c181ce7a5cf91256075799420ea  # v1.1.2
        id: run-tests
        with:
          # Test the whole repo, so that both rule-types and
          # security-baseline/rule-types are covered
          rules-directory: .

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d  # v6.6.1
        if: success() || failure() # always run even if tests fail
        with:
          report_paths: ${{ steps.run-tests.outputs.junit-filename }}
